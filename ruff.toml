# Ruff configuration for script.skinshortcuts

extend-exclude = ["typings"]

line-length = 100

target-version = "py314"

[lint]

preview = true
explicit-preview-rules = true

select = ["E4", "E7", "E9", "F", "B", "PLE", "ASYNC"]

extend-select = [
    "E501",  # Line too long (enforced at line-length above)
    "E301", "E302", "E303", "E304", "E305", "E306",  # blank lines, preview-only in ruff
    "E231",  # missing whitespace after , ; :
    "N806",  # constant-style name inside a function
]

ignore = [
    "E402",  # Module level import not at top - needed for Kodi addon initialization order
]
