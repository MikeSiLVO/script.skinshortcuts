# Ruff configuration for script.skinshortcuts

extend-exclude = ["typings"]

line-length = 100

target-version = "py314"

[lint]

select = ["E4", "E7", "E9", "F", "B", "PLE", "ASYNC"]

extend-select = [
    "E501",  # Line too long (enforced at line-length above)
]

ignore = [
    "E402",  # Module level import not at top - needed for Kodi addon initialization order
]
