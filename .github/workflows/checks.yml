name: Code checks

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.po']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.po']

jobs:
  checks:
    if: github.repository == 'MikeSiLVO/script.skinshortcuts'
    uses: MikeSiLVO/workflows/.github/workflows/checks.yml@v2.4.1
    with:
      tests: true
